name: Staging Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: staging-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-staging:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        persist-credentials: false
    - name: Install python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    - name: Install Julia
      uses: julia-actions/setup-julia@v1
      with:
        version: '1.12'
    # I need to change the prepath in config.md to ensure that within the staging environment, 
    # all links are prefixed with the staging subfolder (e.g. `CNRSPostdocSalary/pr-123/` instead of `CNRSPostdocSalary/`).
    - name: Build
      run: |
        PR=${{ github.event.pull_request.number }}
        sed -i "s|prepath = \"CNRSPostdocSalary\"|prepath = \"CNRSPostdocSalary/pr-${PR}\"|" config.md
        julia -e '
          using Pkg; Pkg.activate("."); Pkg.instantiate();
          using NodeJS; run(`$(npm_cmd()) install highlight.js`);
          using Franklin;
          optimize();
          optimize()'
    - name: Deploy to staging subfolder
      uses: JamesIves/github-pages-deploy-action@releases/v3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: __site
        TARGET_FOLDER: pr-${{ github.event.pull_request.number }}
    - name: Post preview URL comment
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request.number;
          const url = `https://adigioacchino.github.io/CNRSPostdocSalary/pr-${pr}/`;
          const marker = '<!-- staging-preview -->';
          const body = `${marker}\n🔍 **Staging preview:** ${url}`;
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr,
          });
          const existing = comments.data.find(c => c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
          }

  cleanup-staging:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v2
      with:
        ref: gh-pages
    - name: Remove staging subfolder
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git rm -rf pr-${{ github.event.pull_request.number }} || true
        git diff --cached --quiet || git commit -m "Remove staging for PR #${{ github.event.pull_request.number }}"
        git push
